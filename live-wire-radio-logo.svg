<text x="350" y="395" fill="url(#chrome)" stroke="#111" stroke-width="3" paint-order="stroke" font-family="Arial,sans-serif" font-size="91" font-weight="1000" font-style="italic" text-anchor="middle" letter-spacing="-3">LIVE WIRE</text>
