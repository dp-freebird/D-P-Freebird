<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
<title id="title">Live Wire Radio</title><desc id="desc">Circular red, blue and purple neon radio logo with an On Air sign, microphone and mixing desk.</desc>
<defs>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168cff"/><stop offset=".48" stop-color="#8b35ff"/><stop offset="1" stop-color="#ff1744"/></linearGradient>
<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#aeb8d4"/><stop offset=".6" stop-color="#fff"/><stop offset="1" stop-color="#6b7896"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="350" cy="350" r="330" fill="#05060c" stroke="url(#ring)" stroke-width="16" filter="url(#glow)"/>
<circle cx="350" cy="350" r="304" fill="none" stroke="#8b35ff" stroke-opacity=".65" stroke-width="3"/>
